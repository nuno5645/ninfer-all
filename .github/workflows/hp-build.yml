name: HP build (sm_75 + sm_86)
on:
  workflow_dispatch:
  push:
    branches: [hp-tune, hp-3060]
permissions:
  contents: read
jobs:
  linux:
    # hp-tune: the plain build only (the znver2 CPU-expert variant, N13, is no longer built).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ninfer-hp-sm75, march: "" }
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: debian:13-slim
      volumes: ["/usr/share/dotnet:/host-tools/dotnet","/usr/local/lib/android:/host-tools/android","/opt/hostedtoolcache:/host-tools/toolcache","/opt/ghc:/host-tools/ghc"]
    timeout-minutes: 350
    defaults: { run: { shell: bash } }
    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
      CUDA_VERSION: 12.9.2
      ARCHS: "75;86"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Free disk
        run: rm -rf /host-tools/*/* || true; df -h /__w
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git ccache zstd
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-sm75-${{ matrix.march || 'generic' }}-${{ github.sha }}
          restore-keys: |
            ccache-sm75-${{ matrix.march || 'generic' }}-
            ccache-sm75-
      - name: Toolkit
        run: .github/scripts/install-linux-release-tools.sh
      - name: Configure
        run: |
          webui="$(scripts/fetch-webui.sh | sed -n 's/^configure with -DNINFER_WEBUI_DIR=//p')"
          scripts/fetch-media-sources.sh
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="$ARCHS" -DNINFER_SHARED_RUNTIME=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=OFF -DNINFER_BUILD_BENCHMARKS=ON -DNINFER_WEBUI_DIR="$webui" \
            -DNINFER_CPU_EXPERT_MARCH="${{ matrix.march }}"
      - name: Build
        run: cmake --build build-release -j "$(nproc)" --target ninfer-serve ninfer-calibrate ninfer_bench
      - name: Collect
        run: |
          mkdir -p out
          cp -a build-release/portable/. out/
          git rev-parse HEAD > out/REV; echo "cpu-march=${{ matrix.march || 'generic' }}" >> out/REV; find out -maxdepth 3 -type f | head -40; ccache -s | tail -5
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: out/, retention-days: 7 }
